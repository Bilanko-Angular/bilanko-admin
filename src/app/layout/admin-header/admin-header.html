<header class="bk-header">
  <button class="bk-header__menu-btn" (click)="toggleMenu.emit()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <div class="bk-header-info">
    <h1 class="bk-header-title">{{ pageTitle }}</h1>
  </div>

  <div class="bk-header-actions">
    <button class="bk-header__action-btn" (click)="themeService.toggle()" title="Thème">
      <span class="material-icons">
        {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </span>
    </button>

    <div class="bk-profile-wrapper">
      <div class="bk-avatar-wrapper" (click)="profileOpen.set(!profileOpen())">
        <span class="bk-avatar">
          <span class="avatar-placeholder">A</span>
          <span class="bk-avatar__dot"></span>
        </span>
        <span class="bk-avatar__name">
          <strong>Admin</strong>
          <small>Administrateur</small>
        </span>
        <span class="bk-avatar__chevron">▾</span>
      </div>

      @if (profileOpen()) {
        <div class="bk-profile-dropdown" (click)="$event.stopPropagation()">
          <button class="bk-profile-dropdown__action danger" (click)="logout()">
            <span class="material-icons">logout</span> Déconnexion
          </button>
        </div>
      }
    </div>
  </div>
</header>
